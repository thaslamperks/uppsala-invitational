<title>The Uppsala Invitational</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Permanent+Marker&family=Spline+Sans+Mono:wght@400..700&display=swap">
<style>
:root{--navy:#0D1B2E;--navy2:#132743;--gold:#FFCD00;--ivory:#F1ECDD;--mono:'Spline Sans Mono',Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(168deg,var(--navy) 0%,var(--navy2) 62%,#0F2038 100%);color:var(--ivory);font-family:'Schibsted Grotesk','Segoe UI',Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(255,205,0,.05) 1.5px,transparent 1.6px);background-size:26px 26px;pointer-events:none}
.gate{position:relative;max-width:420px;width:100%;text-align:center}
.crest{margin-bottom:18px}
h1{font-family:'Archivo','Arial Black',sans-serif;font-stretch:125%;font-weight:900;text-transform:uppercase;font-size:clamp(1.6rem,6vw,2.2rem);line-height:1;margin:0 0 6px;color:#F6F1E0}
h1 span{color:var(--gold)}
.sub{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#8FB8DC;margin:0 0 26px}
.hint{font-family:'Permanent Marker','Segoe Script',cursive;color:var(--gold);font-size:1.15rem;transform:rotate(-1.6deg);display:inline-block;margin:0 0 18px;text-shadow:0 2px 14px rgba(6,14,26,.5)}
form{display:flex;gap:10px;justify-content:center}
input{flex:1;max-width:230px;background:rgba(9,18,32,.7);border:1px solid rgba(255,205,0,.4);border-radius:10px;color:var(--gold);font-family:var(--mono);font-size:1.05rem;letter-spacing:.3em;text-transform:uppercase;text-align:center;padding:12px 10px;outline:none}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,205,0,.15)}
button{background:var(--gold);color:#12233B;border:none;border-radius:10px;font-family:'Archivo','Arial Black',sans-serif;font-stretch:118%;font-weight:900;text-transform:uppercase;font-size:.9rem;letter-spacing:.05em;padding:12px 20px;cursor:pointer}
button:hover{background:#FFD838}
button:disabled{opacity:.55;cursor:wait}
.msg{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8FA6BF;margin-top:16px;min-height:16px}
.msg.err{color:#F2A3A3}
.gate.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.gate.shake{animation:none}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="crest" aria-hidden="true">
    <svg width="86" height="62" viewBox="0 0 72 52">
      <rect x="0" y="0" width="72" height="52" rx="8" fill="#123055"/>
      <rect x="0" y="0" width="72" height="52" rx="8" fill="none" stroke="#FFCD00" stroke-width="2"/>
      <g fill="#FFCD00">
        <path d="M14 30 l4-9 4 9 v6 h-8z M18 18 l1.6 3.4 -3.2 0z"/>
        <path d="M32 26 l4-11 4 11 v10 h-8z M36 12 l1.8 3.8 -3.6 0z"/>
        <path d="M50 30 l4-9 4 9 v6 h-8z M54 18 l1.6 3.4 -3.2 0z"/>
      </g>
      <circle cx="18" cy="15" r="2" fill="#FFCD00"/><circle cx="36" cy="9" r="2" fill="#FFCD00"/><circle cx="54" cy="15" r="2" fill="#FFCD00"/>
    </svg>
  </div>
  <h1>The Uppsala <span>Invitational</span></h1>
  <p class="sub">Melbourne &middot; 17&ndash;20 Sep 2026 &middot; members only</p>
  <p class="hint">&ldquo;How many times do you live?&rdquo;</p>
  <form id="form">
    <input id="pw" type="password" autocomplete="off" spellcheck="false" maxlength="24" aria-label="Password">
    <button id="btn" type="submit">Unlock</button>
  </form>
  <p class="msg" id="msg">Ask the group chat if you're lost.</p>
</div>
